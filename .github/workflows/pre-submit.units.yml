name: tests

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # Needed to check out the repo.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write comment to PR
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_NUM: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PULL_REQUEST_NUM}" -R "${GITHUB_REPOSITORY}" \
            --create-if-none \
            --edit-last \
            --body "### 👷 Build preview processing...

          | Files | Link |
          |-------|------|
          | 🗎 Ian_M_Lewis_Resume.pdf<br>🗎 Ian_M_Lewis_Resume.ja.pdf | Building... | "

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"

      - name: Install lualatex
        env:
          TEXLIVE_BASE_VERSION: "2023.20240207-1"
          TEXLIVE_EXTRA_VERSION: "2023.20240207-1"
          TEXLIVE_LANG_VERSION: "2023.20240207-1"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends \
            texlive-latex-base=${TEXLIVE_BASE_VERSION} \
            texlive-pictures=${TEXLIVE_BASE_VERSION} \
            texlive-luatex=${TEXLIVE_BASE_VERSION} \
            texlive-xetex=${TEXLIVE_BASE_VERSION} \
            texlive-latex-extra=${TEXLIVE_EXTRA_VERSION} \
            texlive-fonts-extra=${TEXLIVE_EXTRA_VERSION} \
            texlive-formats-extra=${TEXLIVE_EXTRA_VERSION} \
            texlive-pstricks=${TEXLIVE_EXTRA_VERSION} \
            texlive-games=${TEXLIVE_EXTRA_VERSION} \
            texlive-music=${TEXLIVE_EXTRA_VERSION} \
            texlive-publishers=${TEXLIVE_EXTRA_VERSION} \
            texlive-humanities=${TEXLIVE_EXTRA_VERSION} \
            texlive-science=${TEXLIVE_EXTRA_VERSION} \
            texlive-lang-all=${TEXLIVE_LANG_VERSION}

      - name: Build PDF
        run: make Ian_M_Lewis_Resume.tex Ian_M_Lewis_Resume.ja.tex

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: resume
          retention-days: 14
          path: |
            Ian_M_Lewis_Resume.pdf
            Ian_M_Lewis_Resume.ja.pdf

      - name: Write comment to PR
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PULL_REQUEST_NUM: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PULL_REQUEST_NUM}" -R "${GITHUB_REPOSITORY}" \
            --create-if-none \
            --edit-last \
            --body "### ✅ Build preview ready

          | Files | Link |
          |-------|------|
          | 🗎 Ian_M_Lewis_Resume.pdf<br>🗎 Ian_M_Lewis_Resume.ja.pdf | ⬇️[Download](${ARTIFACT_URL}) |
          "

  # Check license headers
  ###############################
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - run: |
          git config user.name "Unknown"
          make license-headers
      - name: check diff
        run: |
          set -euo pipefail
          if [ "$(GIT_PAGER="cat" git diff --ignore-space-at-eol | wc -l)" -gt "0" ]; then
              echo "Detected license header changes.  See status below:"
              echo "::group::git diff"
              GIT_PAGER="cat" git diff
              echo "::endgroup::"
              exit 1
          fi

  # formatting
  ###############################

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
      - run: make format
      - name: check diff
        run: |
          set -euo pipefail
          if [ "$(GIT_PAGER="cat" git diff --ignore-space-at-eol | wc -l)" -gt "0" ]; then
              echo "Detected formatting changes.  See status below:"
              echo "::group::git diff"
              GIT_PAGER="cat" git diff
              echo "::endgroup::"
              exit 1
          fi

  # linters
  ###############################

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: actionlint
        run: make actionlint

  chktex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y chktex
      - run: make chktex

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
      - run: make markdownlint

  renovate-config-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
      - run: make renovate-config-validator

  textlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
      - run: make textlint

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"
      - run: make yamllint

  fixme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make fixme

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        # NOTE: Uploading SARIF requires GitHub Enterprise and GitHub Advanced Security license for private repositories.
        # TODO: Remove the next line for private repositories with GitHub Advanced Security.
        if: github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: zizmor.sarif.json
          category: zizmor
